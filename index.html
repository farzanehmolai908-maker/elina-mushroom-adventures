<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elina Mushroom Adventure</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="game">
        <div id="hud">
            <span>❤️ جان: <b id="lives">3</b></span>
            <span>🪙 سکه: <b id="coins">0</b></span>
            <span>⭐ امتیاز: <b id="score">0</b></span>
        </div>

        <div id="player"></div>

        <div id="ground"></div>

        <div id="controls">
            <button id="leftBtn">◀</button>
            <button id="rightBtn">▶</button>
            <button id="jumpBtn">⬆</button>
            <button id="shootBtn">🔫</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
